<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascadia Winds</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafaf8;
      --fg: #1a1a1a;
      --accent: #2a6f77;
      --muted: #5a5a5a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14181a; --fg: #eaeaea; --muted: #a0a0a0; --accent: #6fc2cc; }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.25rem;
    }
    p.tagline {
      color: var(--muted);
      margin-top: 0;
    }
    a { color: var(--accent); }
    footer {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Cascadia Winds</h1>
    <p class="tagline">This site is under construction.</p>
    <p>Content is on its way — check back soon.</p>
    <footer>&copy; 2026 Cascadia Winds</footer>
  </main>
</body>
</html>
