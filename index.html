<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascadia Winds</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafaf8;
      --fg: #1a1a1a;
      --accent: #2a6f77;
      --muted: #5a5a5a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14181a; --fg: #eaeaea; --muted: #a0a0a0; --accent: #6fc2cc; }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
    }
    ul.roster {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    ul.roster li {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--muted);
      padding-bottom: 0.5rem;
    }
    ul.roster .instrument {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Cascadia Winds</h1>
    <ul class="roster">
      <li><span>Zachary</span><span class="instrument">Flute</span></li>
      <li><span>Laura</span><span class="instrument">Oboe</span></li>
      <li><span>Noah</span><span class="instrument">Clarinet</span></li>
      <li><span>Sam</span><span class="instrument">Bassoon</span></li>
      <li><span>Zach</span><span class="instrument">Horn</span></li>
    </ul>
  </main>
</body>
</html>
